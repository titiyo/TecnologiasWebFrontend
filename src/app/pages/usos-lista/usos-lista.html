<div class="encabezado">
  <h1>Usos</h1>
  <a mat-flat-button routerLink="/usos/nuevo">Nuevo uso</a>
</div>

@if (cargando()) {
  <div class="estado">
    <mat-spinner diameter="40" />
    <p>Cargando usos... (si el backend estaba dormido puede tardar hasta un minuto)</p>
  </div>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else if (usos().length === 0) {
  <p>No hay usos cargados.</p>
} @else {
  <table mat-table [dataSource]="usos()">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let uso">{{ uso.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let uso">{{ uso.nombre }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  </table>
}
