<h1>{{ id ? 'Editar uso' : 'Nuevo uso' }}</h1>

@if (cargando()) {
  <mat-spinner diameter="40" />
} @else {
  <form #form="ngForm" (ngSubmit)="guardar()">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput name="nombre" [(ngModel)]="nombre" required #campo="ngModel" />
      @if (campo.invalid && campo.touched) {
        <mat-error>El nombre es obligatorio.</mat-error>
      }
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="acciones">
      <button mat-flat-button type="submit" [disabled]="form.invalid || guardando()">Guardar</button>
      <a mat-button routerLink="/usos">Cancelar</a>
    </div>
  </form>
}
